name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # No ffmpeg here on purpose. Every test targets pure logic: the arithmetic
      # deciding what gets cut, rotated or called too loud. The subprocess layer
      # is exercised by running the tools on real footage, which CI cannot do
      # and should not pretend to.
      - name: Tests
        run: pytest

      # Set ordering is randomised per process. A tool that gives different
      # answers to the same question on different runs is not verifiable, and
      # this repo had exactly that bug in its sibling. Cheap to rule out.
      - name: Tests again under a different hash seed
        run: pytest
        env:
          PYTHONHASHSEED: 1
